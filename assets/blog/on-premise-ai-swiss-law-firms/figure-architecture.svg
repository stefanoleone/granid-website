<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="figtitle figdesc" font-family="Geist, Inter, system-ui, sans-serif">
  <title id="figtitle">On-premise vs. cloud data flow</title>
  <desc id="figdesc">Client documents and AI processing stay inside the firm's office. Data never reaches external cloud servers.</desc>

  <rect width="1200" height="675" fill="#F5F5F4"/>

  <!-- Office boundary -->
  <rect x="60" y="90" width="640" height="500" rx="20" fill="#FAFAF9" stroke="#1C1917" stroke-width="3"/>
  <text x="90" y="140" font-size="22" font-weight="600" letter-spacing="2" fill="#1C1917">YOUR OFFICE</text>
  <text x="90" y="168" font-size="15" fill="#78716C">Data stays in the building. Always.</text>

  <!-- Documents -->
  <g transform="translate(120,250)">
    <rect x="0" y="0" width="120" height="150" rx="8" fill="#E7E5E4" stroke="#44403C" stroke-width="2"/>
    <rect x="18" y="20" width="120" height="150" rx="8" fill="#FAFAF9" stroke="#44403C" stroke-width="2"/>
    <line x1="38" y1="56" x2="120" y2="56" stroke="#78716C" stroke-width="3"/>
    <line x1="38" y1="84" x2="120" y2="84" stroke="#78716C" stroke-width="3"/>
    <line x1="38" y1="112" x2="100" y2="112" stroke="#78716C" stroke-width="3"/>
    <text x="60" y="210" font-size="16" font-weight="600" fill="#1C1917" text-anchor="middle">Client files</text>
  </g>

  <!-- Mac Mini running the AI -->
  <g transform="translate(420,250)">
    <rect x="0" y="40" width="180" height="110" rx="14" fill="#1C1917"/>
    <circle cx="90" cy="95" r="22" fill="none" stroke="#FAFAF9" stroke-width="3"/>
    <circle cx="90" cy="95" r="5" fill="#DA281C"/>
    <text x="90" y="200" font-size="16" font-weight="600" fill="#1C1917" text-anchor="middle">Mac · on-premise AI</text>
  </g>

  <!-- Internal arrow (documents -> Mac) -->
  <line x1="260" y1="320" x2="410" y2="320" stroke="#44403C" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- External cloud, unreachable -->
  <g transform="translate(820,250)">
    <path d="M40 110 a55 55 0 0 1 10 -108 a70 70 0 0 1 132 18 a48 48 0 0 1 -12 95 z" fill="#FAFAF9" stroke="#78716C" stroke-width="3" stroke-dasharray="10 8"/>
    <text x="100" y="175" font-size="16" font-weight="600" fill="#78716C" text-anchor="middle">External cloud</text>
  </g>

  <!-- Blocked path to cloud -->
  <line x1="610" y1="305" x2="800" y2="305" stroke="#DA281C" stroke-width="3" stroke-dasharray="10 8"/>
  <g transform="translate(705,305)">
    <circle r="26" fill="#FAFAF9" stroke="#DA281C" stroke-width="3"/>
    <line x1="-12" y1="-12" x2="12" y2="12" stroke="#DA281C" stroke-width="3"/>
    <line x1="-12" y1="12" x2="12" y2="-12" stroke="#DA281C" stroke-width="3"/>
  </g>
  <text x="705" y="370" font-size="14" fill="#DA281C" text-anchor="middle" font-weight="600">No data leaves your office</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#44403C"/>
    </marker>
  </defs>
</svg>
