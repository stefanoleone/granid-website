<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="A small desktop computer on a lawyer's desk, casting the long shadow of a full server rack on the wall behind it.">
  <rect width="1200" height="630" fill="#F5F5F4"/>
  <!-- Shadow on the wall: the silhouette of a full server rack, cast by the small computer -->
  <g transform="translate(495,500) skewX(-18)">
    <rect x="-150" y="-430" width="300" height="430" fill="#E7E5E4"/>
    <g stroke="#F5F5F4" stroke-width="7" stroke-linecap="round">
      <line x1="-118" y1="-390" x2="118" y2="-390"/>
      <line x1="-118" y1="-344" x2="118" y2="-344"/>
      <line x1="-118" y1="-298" x2="118" y2="-298"/>
      <line x1="-118" y1="-252" x2="118" y2="-252"/>
      <line x1="-118" y1="-206" x2="118" y2="-206"/>
      <line x1="-118" y1="-160" x2="118" y2="-160"/>
      <line x1="-118" y1="-114" x2="118" y2="-114"/>
      <line x1="-118" y1="-68" x2="118" y2="-68"/>
    </g>
  </g>
  <!-- Desk -->
  <rect x="150" y="500" width="700" height="20" rx="4" fill="#D6D3D1"/>
  <rect x="192" y="520" width="18" height="110" fill="#D6D3D1"/>
  <rect x="790" y="520" width="18" height="110" fill="#D6D3D1"/>
  <!-- Small desktop computer -->
  <rect x="420" y="450" width="150" height="52" rx="12" fill="#D6D3D1" stroke="#F5F5F4" stroke-width="6"/>
  <circle cx="547" cy="476" r="5" fill="#DA281C"/>
  <!-- Case files on the desk -->
  <rect x="640" y="486" width="120" height="14" rx="3" fill="#E7E5E4"/>
  <rect x="652" y="472" width="96" height="14" rx="3" fill="#D6D3D1"/>
</svg>
